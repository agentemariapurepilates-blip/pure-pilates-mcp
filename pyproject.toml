[project]
name = "pure-pilates-mcp"
version = "0.1.0"
description = "MCP server com os guias da Pure Pilates: visual, marca e copy."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Pure Pilates" }]
keywords = ["mcp", "pure-pilates", "brand", "guide"]
dependencies = [
    "mcp>=1.0.0",
]

[project.scripts]
pure-pilates-mcp = "server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["server.py"]
